name: Interactive Ubuntu Shell

on:
  workflow_dispatch:

jobs:
  test-env:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ANSI C, Vi, and Traditional Unix Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bsdmainutils vim-tiny telnet ed man-db curl
          printf '#!/bin/bash\nexec /usr/bin/gcc -ansi -pedantic -Wall -Wextra "$@"\n' | sudo tee /usr/local/bin/cc
          sudo chmod +x /usr/local/bin/cc
          printf '#include <stdio.h>\n\nint main(void) {\n    printf("Hello, Traditional ANSI C World!\\n");\n    return 0;\n}\n' > helloworld.c
          cp helloworld.c /home/runner/helloworld.c

      - name: Launch Interactive Web Terminal
        run: |
          # 1. Download ttyd and cloudflared
          sudo curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          sudo curl -sLo /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

          # 2. Start ttyd with full write access in the workspace
          ttyd -W -p 7681 bash &

          # 3. Create Cloudflare Quick Tunnel
          cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/cf_tunnel.log 2>&1 &

          # 4. Wait for tunnel URL
          sleep 6
          TUNNEL_URL=""
          for i in {1..10}; do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/cf_tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "=========================================="
          echo "LIVE WEB TERMINAL URL: $TUNNEL_URL"
          echo "=========================================="

          # 5. Export to Step Summary
          echo "### 🚀 Ubuntu VM is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open Ubuntu Terminal]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY

          # 6. Push to session-info branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B session-info
          echo "$TUNNEL_URL" > session.txt
          git add session.txt
          git commit -m "Live Web Terminal: $TUNNEL_URL"
          git push -f origin session-info || true

          # 7. Keep VM alive for 60 minutes
          sleep 3600