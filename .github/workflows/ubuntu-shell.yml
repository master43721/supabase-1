name: Interactive Ubuntu Shell

on:
  workflow_dispatch:

jobs:
  test-env:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ANSI C, Vi, and Traditional Unix Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bsdmainutils vim-tiny telnet ed man-db openssh-client curl
          sudo bash -c 'cat << "EOF" > /usr/local/bin/cc
          #!/bin/bash
          exec /usr/bin/gcc -ansi -pedantic -Wall -Wextra "\$@"
          EOF'
          sudo chmod +x /usr/local/bin/cc
          cat << "EOF" > helloworld.c
          #include <stdio.h>

          int main(void) {
              printf("Hello, Traditional ANSI C World!\n");
              return 0;
          }
          EOF
          cp helloworld.c /home/runner/helloworld.c

      - name: Launch Interactive Shell Session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL https://github.com/owenthereal/upterm/releases/download/v0.41.1/upterm_linux_amd64.deb -o /tmp/upterm.deb
          sudo apt install -y /tmp/upterm.deb
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N '' -q
          upterm host --server wss://uptermd.upterm.dev:443 --force-command bash &
          sleep 5
          SSH_CMD=$(upterm session current | grep 'SSH Session:' | sed 's/SSH Session: //')
          echo "=========================================="
          echo "SSH COMMAND: $SSH_CMD"
          echo "=========================================="
          echo "### 🚀 Ubuntu VM is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run this command in PowerShell / CMD to connect:" >> $GITHUB_STEP_SUMMARY
          echo "\\\ash" >> $GITHUB_STEP_SUMMARY
          echo "$SSH_CMD" >> $GITHUB_STEP_SUMMARY
          echo "\\\" >> $GITHUB_STEP_SUMMARY

          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="SSH_COMMAND: $SSH_CMD" || true

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B session-info
          echo "$SSH_CMD" > session.txt
          git add session.txt
          git commit -m "Update live SSH command"
          git push -f origin session-info || true

          sleep 3600